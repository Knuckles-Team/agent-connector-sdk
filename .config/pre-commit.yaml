# Combined pre-commit and pre-push scan suite for agent-connector-sdk.
#
# Repository-agnostic complexity, clone, security, privacy, supply-chain,
# hygiene, code-shape, and documentation gates come from the shared
# Knuckles-Team/pipelines repository at a pinned commit. Repository-specific
# settings live in `pyproject.toml` under `[tool.pipelines_hooks]`.
#
# Hosted CI runs this file directly (.github/workflows/release.yml), so local
# and CI results agree:
#   uvx --from pre-commit==4.6.0 pre-commit run --all-files --config .config/pre-commit.yaml
#   ... --hook-stage pre-push     (tests, wheel build, secret history)
#   ... --hook-stage manual <id>  (native scanners, privacy, fleet gates)
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$
  - id: check-ast
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix"]
  - id: ruff-format
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: ["agent_connector_sdk", "--min-confidence", "95"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    exclude: ^(tests/|scripts/)
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
  hooks:
  - id: uv-lock
    args: ["--locked"]
    # The SDK consumes a generated EG contract before its matching wheel is
    # published. Resolve against the public index only at release time.
    stages: [manual]
# ── Shared gates (Knuckles-Team/pipelines, pinned) ─────────────────────────────
- repo: https://github.com/Knuckles-Team/pipelines
  rev: 444b232c7975e125a24b17d53ff615f5ad26a4cd
  hooks:
  # Native scanners (pinned versions; never installed by a hook). Manual only:
  # install them with `scripts/bootstrap.sh --scanners`; hosted CI runs them
  # in the advisory scanner-quality job.
  - id: complexity-staged
    stages: [manual]
  - id: kiss-staged
    stages: [manual]
  - id: dupehound-changed
    stages: [manual]
  - id: complexity-census
    stages: [manual]
  - id: kiss-census
    stages: [manual]
  - id: jscpd-differential
    stages: [manual]
  - id: jscpd-census
    stages: [manual]
  - id: scanner-versions
    stages: [manual]
  # code shape
  - id: no-stub
    stages: [pre-commit, manual]
  - id: stubs
    exclude: ^tests/
    stages: [pre-commit, manual]
  - id: env-sprawl
    stages: [pre-commit, manual]
  - id: stdout-writes
    stages: [pre-commit, manual]
  # public documentation
  - id: public-surface
    stages: [pre-commit, manual]
  - id: swallowed-errors
    stages: [pre-commit, manual]
  - id: event-loop-blocking
    stages: [pre-commit, manual]
  - id: import-cycles
    stages: [pre-commit, manual]
  # supply chain, secrets, privacy, hygiene. No gate calls an external
  # service: the OSV dependency-audit hook is deliberately not enabled.
  - id: supply-chain
    stages: [pre-commit, manual]
  - id: secret-history
    stages: [pre-push, manual]
  - id: security-sanitizer
    stages: [pre-commit, manual]
  # Needs the operator-owned identity catalog, which is never committed; CI
  # runs it when the PROHIBITED_IDENTITY_CATALOG repository variable is set.
  - id: tracked-privacy
    stages: [manual]
  - id: root-hygiene
    stages: [pre-commit, manual]
  - id: gitignore-convergence
    stages: [pre-commit, manual]
  - id: sprawl
    stages: [pre-commit, manual]
  - id: mermaid
    stages: [pre-commit, manual]
  - id: pre-commit-patch-safety
    stages: [pre-push, manual]
- repo: local
  hooks:
  # ── Types, tests, build, docs (CI parity) ────────────────────────────────
  - id: mypy
    name: mypy (strict, project environment)
    entry: bash -c 'bash scripts/bootstrap_epistemic_graph_contract.sh && PYTHONPATH=.ci/epistemic-graph uv run --frozen --with mypy==1.20.2 --with types-PyYAML==6.0.12.20260518 python -m mypy agent_connector_sdk'
    language: system
    pass_filenames: false
    files: ^(agent_connector_sdk/.*\.py|pyproject\.toml|uv\.lock)$
  - id: pytest
    name: pytest (full suite)
    entry: bash -c 'bash scripts/bootstrap_epistemic_graph_contract.sh && PYTHONPATH=.ci/epistemic-graph uv run --frozen python -m pytest -q'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: wheel-build
    name: package build
    entry: bash -c 'uv build --out-dir "$(mktemp -d)/dist"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # ── Wiring ───────────────────────────────────────────────────────────────
  - id: check-orphan-modules
    name: Wiring — no orphan package modules
    # The project interpreter: the package uses Python 3.12 syntax.
    entry: uv run --frozen python scripts/check_wiring.py orphans
    language: system
    pass_filenames: false
    always_run: true
  - id: check-public-api-tested
    name: Wiring — every public name is used by a test
    entry: uv run --frozen python scripts/check_wiring.py public-api
    language: system
    pass_filenames: false
    always_run: true
  # ── Fleet dependency order (maintainer gates) ─────────────────────────────
  # Both need the fleet workspace layout (a sibling agents/repository-manager
  # checkout and a workspace.yml); outside it they report SKIPPED locally.
  - id: dependency-readiness
    name: Dependency readiness — every declared intra-fleet constraint is installable
    entry: bash scripts/run_fleet_gate.sh dependency-readiness
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: phase-direction
    name: Phase direction — no dependency on a later workspace phase
    entry: bash scripts/run_fleet_gate.sh phase-direction
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: check-bumpversion
    name: validate bumpversion config
    entry: uvx --from bump2version==1.0.1 bump2version patch --dry-run --allow-dirty
    language: system
    pass_filenames: false
    always_run: true
- repo: local
  hooks:
  - id: check-public-specs
    name: Public specs are self-contained and locally linked
    entry: python3 scripts/check_public_specs.py
    language: system
    pass_filenames: false
    files: ^(specs/|scripts/check_public_specs\.py$|\.specify/memory/constitution\.md$)
