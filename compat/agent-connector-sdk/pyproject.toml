[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-connector-sdk"
version = "0.5.8"
description = "Metadata-only compatibility release forwarding agent-connector-sdk users to Scion SDK"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "scion-sdk==0.5.8",
]

[project.optional-dependencies]
integrity = ["scion-sdk[integrity]==0.5.8"]
mcp = ["scion-sdk[mcp]==0.5.8"]
a2a = ["scion-sdk[a2a]==0.5.8"]
feeds = ["scion-sdk[feeds]==0.5.8"]
dataprep = ["scion-sdk[dataprep]==0.5.8"]
db = ["scion-sdk[db]==0.5.8"]
mssql = ["scion-sdk[mssql]==0.5.8"]
graphql = ["scion-sdk[graphql]==0.5.8"]
market = ["scion-sdk[market]==0.5.8"]
stream = ["scion-sdk[stream]==0.5.8"]
vector = ["scion-sdk[vector]==0.5.8"]
vector-chroma = ["scion-sdk[vector-chroma]==0.5.8"]

[project.urls]
Homepage = "https://github.com/Knuckles-Team/scion-sdk"
Documentation = "https://knuckles-team.github.io/scion-sdk/"

# This project intentionally has no Python modules, entry points, or console
# scripts. It is a forward-only dependency alias for the renamed distribution.
[tool.setuptools]
packages = []
py-modules = []
