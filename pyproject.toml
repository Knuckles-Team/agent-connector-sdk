[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-connector-sdk"
dynamic = ["version"]
description = "Connector SDK for the agent-packages fleet: MCP server scaffolding, connector manifests, and typed source/content extension ports"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The SDK depends on the MCP server/client stack and the epistemic-graph client
# only. It must never depend on agent-utilities (RF-ADR-009 phase order: the SDK
# is phase 3, agent-utilities is phase 4).
dependencies = [
    "fastmcp>=4.0.3,<5",
    "epistemic-graph>=2.23.0,<3",
    "pydantic>=2.13.4,<3",
    "PyYAML>=6.0.3",
    "httpx>=0.28.1",
    "anyio>=4.13.0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@example.invalid"

[project.urls]
Homepage = "https://github.com/Knuckles-Team/agent-connector-sdk"
Documentation = "https://knuckles-team.github.io/agent-connector-sdk/"

[project.scripts]
connector-sync = "agent_connector_sdk.runner.cli:main"
connector-certify = "agent_connector_sdk.certify.cli:main"

[project.entry-points."agent_connector_sdk.source_adapters"]
mcp_tool = "agent_connector_sdk.adapters.mcp_tool:McpToolSourceAdapter"

[project.entry-points."agent_connector_sdk.artifact_kinds"]
tools = "agent_connector_sdk.artifacts.tools:ToolArtifactKind"
skills = "agent_connector_sdk.artifacts.skills:SkillArtifactKind"
prompts = "agent_connector_sdk.artifacts.prompts:PromptArtifactKind"
resources = "agent_connector_sdk.artifacts.resources:ResourceArtifactKind"

[project.entry-points."agent_connector_sdk.transports"]
mcp = "agent_connector_sdk.transports.mcp:McpTransport"

[project.entry-points."agent_connector_sdk.sinks"]
epistemic_graph = "agent_connector_sdk.sinks.epistemic_graph:EpistemicGraphSink"

[tool.setuptools.dynamic]
version = { attr = "agent_connector_sdk._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_connector_sdk*"]

[tool.setuptools.package-data]
agent_connector_sdk = ["py.typed"]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
]
docs = [
    "mkdocs-material==9.7.7",
]

[tool.uv]
default-groups = ["test"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 120
addopts = "-p no:cacheprovider"

[tool.bandit]
exclude_dirs = ["tests", "scripts"]

[tool.agent_connector_sdk.scanners]
# Pinned to epistemic-graph's scripts/scanner_contract.py.
cccc_version = "1.6.0"
kiss_version = "0.4.10"

[tool.agent_connector_sdk.wiring]
# The documented public surface. scripts/check_orphan_modules.py treats these and
# every entry-point target as roots; every other module must be imported by one.
public_modules = [
    "agent_connector_sdk.adapters.mcp_tool",
    "agent_connector_sdk.certify.cli",
    "agent_connector_sdk.artifacts.pack",
    "agent_connector_sdk.config",
    "agent_connector_sdk.contracts",
    "agent_connector_sdk.credentials.openbao",
    "agent_connector_sdk.credentials.references",
    "agent_connector_sdk.credentials.resolution",
    "agent_connector_sdk.credentials.resolver",
    "agent_connector_sdk.discovery",
    "agent_connector_sdk.exceptions",
    "agent_connector_sdk.identity",
    "agent_connector_sdk.manifest.live_contract",
    "agent_connector_sdk.manifest.loader",
    "agent_connector_sdk.manifest.model",
    "agent_connector_sdk.manifest.presets",
    "agent_connector_sdk.manifest.tool_schema",
    "agent_connector_sdk.mcp.action_dispatch",
    "agent_connector_sdk.mcp.auth.factory",
    "agent_connector_sdk.mcp.change_events",
    "agent_connector_sdk.mcp.concurrency",
    "agent_connector_sdk.mcp.content",
    "agent_connector_sdk.mcp.context",
    "agent_connector_sdk.mcp.registry",
    "agent_connector_sdk.mcp.server",
    "agent_connector_sdk.mcp.tool_mode",
    "agent_connector_sdk.mcp.tool_surface",
    "agent_connector_sdk.ports.artifact_kind",
    "agent_connector_sdk.ports.change_source",
    "agent_connector_sdk.ports.checkpoint_store",
    "agent_connector_sdk.ports.connector_registry",
    "agent_connector_sdk.ports.errors",
    "agent_connector_sdk.ports.session",
    "agent_connector_sdk.ports.sink",
    "agent_connector_sdk.ports.source_adapter",
    "agent_connector_sdk.ports.transport",
    "agent_connector_sdk.runner.checkpoints",
    "agent_connector_sdk.runner.cli",
    "agent_connector_sdk.runner.composition",
    "agent_connector_sdk.runner.descriptors",
    "agent_connector_sdk.runner.endpoints",
    "agent_connector_sdk.runner.errors",
    "agent_connector_sdk.runner.static_registry",
    "agent_connector_sdk.runner.supervisor",
    "agent_connector_sdk.testing.artifact_kinds",
    "agent_connector_sdk.testing.results",
    "agent_connector_sdk.testing.sinks",
    "agent_connector_sdk.testing.source_adapters",
    "agent_connector_sdk.transports.mcp",
    "agent_connector_sdk.utilities",
]

# Copied from agent-packages/agent-utilities/pyproject.toml (the fleet clone-scanner
# contract); agent-utilities-only exclusions removed.
[tool.agent_connector_sdk.clone_scanners]
# Native scanners are installed by the host/toolchain, never by a hook.  Keep
# exact versions here so the wrappers, local setup notes, and CI all reject
# silent algorithm/threshold drift from the same reviewed contract.
dupehound_version = "0.1.2"
dupehound_threshold = 0.85
dupehound_min_tokens = 40
jscpd_version = "5.0.16"
jscpd_min_tokens = 50
jscpd_min_lines = 5
jscpd_mode = "mild"

# jscpd's differential pass includes both code and non-code formats. Dupehound
# detects structurally equivalent whole functions after renaming; it cannot
# detect a copied block embedded in two otherwise different functions. Keeping
# code formats here preserves that complementary block-level coverage. The two
# scanners run at different stages (dupehound at pre-commit, jscpd at pre-push)
# so one incident does not produce two simultaneous blocking hook verdicts.
jscpd_diff_formats = [
    "asciidoc",
    "astro",
    "bash",
    "bicep",
    "c",
    "c-header",
    "cpp",
    "cpp-header",
    "css",
    "csharp",
    "csv",
    "cypher",
    "dhall",
    "docker",
    "graphql",
    "go",
    "hcl",
    "ini",
    "java",
    "javascript",
    "json",
    "json5",
    "jsx",
    "less",
    "makefile",
    "markdown",
    "markup",
    "mermaid",
    "nginx",
    "protobuf",
    "promql",
    "properties",
    "pug",
    "php",
    "python",
    "ruby",
    "rust",
    "sass",
    "scss",
    "sql",
    "svelte",
    "stylus",
    "swift",
    "toml",
    "turtle",
    # jscpd emits plain Markdown fragments as its virtual `text` format;
    # retain `txt` as the extension-backed format for standalone .txt files.
    "text",
    "txt",
    "tsx",
    "typescript",
    "vue",
    "yaml",
]
jscpd_diff_extensions = [
    ".adoc",
    ".asciidoc",
    ".astro",
    ".bash",
    ".bicep",
    ".c",
    ".c++",
    ".cc",
    ".cjs",
    ".cpp",
    ".cs",
    ".cts",
    ".cxx",
    ".css",
    ".csv",
    ".cypher",
    ".conf",
    ".dhall",
    ".gql",
    ".graphql",
    ".go",
    ".h",
    ".h++",
    ".hh",
    ".hpp",
    ".hxx",
    ".hcl",
    ".htm",
    ".html",
    ".ini",
    ".java",
    ".js",
    ".json",
    ".json5",
    ".jsx",
    ".less",
    ".md",
    ".markdown",
    ".mkd",
    ".mmd",
    ".mermaid",
    ".mjs",
    ".mts",
    ".nginx",
    ".php",
    ".proto",
    ".promql",
    ".properties",
    ".pug",
    ".py",
    ".pyi",
    ".rb",
    ".rs",
    ".sass",
    ".scss",
    ".sh",
    ".sql",
    ".svelte",
    ".styl",
    ".swift",
    ".tf",
    ".toml",
    ".ttl",
    ".ts",
    ".tsx",
    ".txt",
    ".vue",
    ".xml",
    ".yaml",
    ".yml",
]
# Both scanners receive these exclusions.  Generated/vendor/build output,
# lockfiles, fixtures, and docs/examples are intentionally outside the clone
# policy: they are machine-produced or expected to repeat, and including them
# makes a changed-function gate report noise rather than a reusable source.
exclusions = [
    "**/.git/**",
    "**/.venv/**",
    "**/.venv-base/**",
    "**/venv/**",
    "**/node_modules/**",
    "**/.cache/**",
    "**/target/**",
    "**/target-isolated/**",
    "**/build/**",
    "**/build-artifacts/**",
    "**/dist/**",
    "**/dist-primary/**",
    "**/dist-reproduction/**",
    "**/__pycache__/**",
    "**/.mypy_cache/**",
    "**/.pytest_cache/**",
    "**/.pytest_tmp/**",
    "**/.ruff_cache/**",
    "**/.hypothesis/**",
    "**/.tox/**",
    "**/.eggs/**",
    "**/coverage/**",
    "**/htmlcov/**",
    "**/site-packages/**",
    "**/*.egg-info/**",
    "**/vendor/**",
    "**/third_party/**",
    "**/fixtures/**",
    "**/fixture/**",
    "**/samples/**",
    "**/sample/**",
    "**/examples/**",
    "**/docs/examples/**",
    "**/docs/samples/**",
    "**/__snapshots__/**",
    "**/*.snap",
    "**/__generated__/**",
    "**/generated/**",
    "**/codegen/**",
    "**/openapi_client/**",
    "**/graphql_client/**",
    "**/*.generated.*",
    "**/*.map",
    "**/*.min.css",
    "**/*.min.js",
    "**/*.lock",
    "**/*lock",
    "**/*lock.*",
    "**/Cargo.lock",
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/yarn.lock",
    "**/poetry.lock",
]

# This is the directory-name subset needed to prune before invoking jscpd.
# Its ignore globs above remain defense-in-depth for files nested below a kept
# source directory; the native tool's ignore option does not prune its walk.
prune_directories = [
    ".git",
    ".venv",
    "venv",
    ".venv-base",
    "node_modules",
    ".cache",
    "target",
    "target-isolated",
    "dist",
    "dist-primary",
    "dist-reproduction",
    "build",
    "build-artifacts",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    ".pytest_tmp",
    ".ruff_cache",
    ".hypothesis",
    ".tox",
    ".eggs",
    "coverage",
    "htmlcov",
    "site-packages",
    "vendor",
    "third_party",
    "fixtures",
    "fixture",
    "samples",
    "sample",
    "examples",
    "__snapshots__",
    "__generated__",
    "generated",
    "codegen",
    "openapi_client",
    "graphql_client",
]

[tool.agent_connector_sdk.clone_scanners.jscpd_diff_format_extensions]
# v5 has grammars for these formats but no default extension mapping; the
# wrapper passes this exact table via --formats-exts so selected files are real
# scanner inputs rather than silently skipped paths.
asciidoc = ["adoc", "asciidoc"]
cypher = ["cypher"]
dhall = ["dhall"]
graphql = ["gql"]
mermaid = ["mermaid", "mmd"]
nginx = ["conf", "nginx"]
promql = ["promql"]

[tool.agent_connector_sdk.clone_scanners.jscpd_diff_format_names]
docker = ["Containerfile", "Dockerfile"]
makefile = ["GNUmakefile", "Makefile"]
