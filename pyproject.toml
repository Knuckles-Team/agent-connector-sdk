# Inputs of the shared hooks (Knuckles-Team/pipelines .pre-commit-hooks.yaml).
[tool.pipelines_hooks]
packages = ["agent_connector_sdk"]

[tool.pipelines_hooks.env_sprawl]
allow_files = ["agent_connector_sdk/config.py"]

[tool.pipelines_hooks.stdout_writes]
served_paths = ["agent_connector_sdk"]

# The only accepted stubs: epistemic-graph wire methods not published yet
# (RF-ADR-009 W1), printed as NOT DONE. Delete the entry when the wave lands.
[tool.pipelines_hooks.stubs]
declared_seams = { "agent_connector_sdk/sinks/epistemic_graph.py" = ["PACK_IMPORT_UNAVAILABLE", "RECORD_INGESTION_UNAVAILABLE"] }

[tool.pipelines_hooks.ci_replica]
build_affecting = ["pyproject.toml", "uv.lock", "mkdocs.yml", "pages/**", ".github/workflows/**", ".pre-commit-config.yaml"]

[tool.pipelines_hooks.ci_replica.workflows."release.yml"]
blocking = true
executable_jobs = ["gates", "build"]

[tool.pipelines_hooks.ci_replica.workflows."release.yml".skip_reasons]
scanner-quality = "provisions the pinned cccc/kiss/dupehound/jscpd toolchain on the runner (cargo install, npm install); local replay never installs tools, and the pre-push hooks run the same shared gates against the locally installed, version-verified binaries"
publish-pypi = "requires a vX.Y.Z release tag and PyPI trusted publishing; publishing must never happen from a local hook"

[tool.pipelines_hooks.ci_replica.workflows."pages.yml"]
blocking = true
executable_jobs = ["build"]

[tool.pipelines_hooks.ci_replica.workflows."pages.yml".skip_reasons]
deploy = "deploys to the GitHub Pages environment, which has no local equivalent; the build job it depends on is replayed"
