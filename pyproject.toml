[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scion-sdk"
version = "0.6.3"
description = "Scion SDK for the Arbora ecosystem: MCP server scaffolding, connector manifests, and typed source/content extension ports"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The base install has the MCP protocol types (mcp-types, pydantic only) and the
# epistemic-graph client. The MCP server/client stack is the "mcp" extra.
# It must never depend on the agent control plane.
dependencies = [
    "medulla>=2.27.10,<3.0.0",
    "mcp-types>=2.3.0,<3",
    "pydantic>=2.14.1,<3",
    "PyYAML>=6.0.3",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "anyio>=4.15.1",
    "cryptography>=50.0.2",
    "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
requests = [
    "requests>=2.34.0,<3",
]
integrity = [
    "rdflib>=7.1.0",
]
mcp = [
    "fastmcp>=4.1.0,<5",
    "mcp>=2.3.0,<3",
]
# Server-side A2A application factory (scion_sdk.a2a.app). The wire
# models and the client are in the base install.
a2a = [
    "fasta2a[pydantic-ai]>=0.6.1,<1.0.0",
    "starlette>=1.8.0,<2",
]

feeds = [
    "feedparser>=6.0.12",
]
dataprep = [
    "pyarrow>=24.0.0",
]
db = [
    "psycopg[binary]>=3.2.0",
    "PyMySQL>=1.1.1",
    "pymongo>=4.10.0",
    "oracledb>=2.5.0",
]
mssql = [
    "pyodbc>=5.2.0",
]
# The shared GraphQL client (scion_sdk.transports.graphql) and the
# introspection helpers. Connectors declare only this extra for GraphQL.
graphql = [
    "gql[requests]>=4.4.0",
    "graphql-core>=3.2.5",
]
market = [
    "ccxt==4.4.100",
    "pandas>=2.2.0",
    "yfinance>=0.2.50",
]
stream = [
    "websockets>=14.0",
]
# Vector-store clients for connectors whose target system is a vector store.
# The relational and document clients share the `db` floors.
vector = [
    "qdrant-client>=1.18.0",
    "psycopg[binary,pool]>=3.2.0",
    "pymongo>=4.10.0",
]
# The embedded-index store and its index adapter carry a large native stack, so
# they install apart from `vector` (as `mssql` installs apart from `db`).
vector-chroma = [
    "chromadb>=1.5.0",
    "llama-index-vector-stores-chroma>=0.5.0",
]
workspace = [
    "pypdf>=6.21.3,<7",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.urls]
Homepage = "https://github.com/Knuckles-Team/scion-sdk"
Documentation = "https://knuckles-team.github.io/scion-sdk/"

[project.scripts]
connector-sync = "scion_sdk.runner.cli:main"
connector-certify = "scion_sdk.certify.cli:main"
ingest-worker = "scion_sdk.runner.ingest_worker_cli:main"

[project.entry-points.pytest11]
scion_sdk = "scion_sdk.testing.plugin"

[project.entry-points."scion_sdk.source_adapters"]
mcp_tool = "scion_sdk.adapters.mcp_tool:McpToolSourceAdapter"
web_fetch = "scion_sdk.adapters.web_fetch:WebFetchSourceAdapter"
rum = "scion_sdk.adapters.event_feed_bindings:rum_source_adapter"
security_audit = "scion_sdk.adapters.event_feed_bindings:security_audit_source_adapter"
ci_cd = "scion_sdk.adapters.event_feed_bindings:ci_cd_source_adapter"

# Expose this SDK's development skill to the same provider federation
# epistemic-graph and agent-webui use. This is metadata only: consumers
# discover the entry point when a skill-provider host is installed, without
# imposing it as an scion-sdk runtime dependency.
[project.entry-points."scion_sdk.skill_providers"]
scion-sdk = "scion_sdk.skills"

[project.entry-points."scion_sdk.artifact_kinds"]
tools = "scion_sdk.artifacts.tools:ToolArtifactKind"
skills = "scion_sdk.artifacts.skills:SkillArtifactKind"
prompts = "scion_sdk.artifacts.prompts:PromptArtifactKind"
resources = "scion_sdk.artifacts.resources:ResourceArtifactKind"

[project.entry-points."scion_sdk.transports"]
mcp = "scion_sdk.transports.mcp:McpTransport"

[project.entry-points."scion_sdk.sinks"]
epistemic_graph = "scion_sdk.sinks.epistemic_graph:EpistemicGraphSink"

[tool.setuptools.packages.find]
where = ["."]
include = ["scion_sdk*"]

[tool.setuptools.package-data]
scion_sdk = ["py.typed", "skills/**/*", "ontology/*.ttl"]

[dependency-groups]
test = [
    "scion-sdk[mcp,feeds,dataprep,integrity,graphql,a2a,requests,workspace]",
    "pandas>=2.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "bump2version>=1.0.1",
]
docs = [
    "mkdocs-material==9.7.7",
]
typecheck = [
    "scion-sdk[mcp,feeds,dataprep,integrity,graphql,requests]",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
    "types-requests>=2.32.0",
    "types-defusedxml>=0.7.0",
]

[tool.uv]
default-groups = ["test"]
# epistemic-graph installs from PyPI only, as a published wheel: never from
# source, so no Rust toolchain is ever invoked.
no-build-package = ["medulla"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

# Optional-extra libraries without type information; each import is lazy.
[[tool.mypy.overrides]]
module = [
    "akshare",
    "atlassian_agent.*",
    "ccxt",
    "emerald_exchange.*",
    "fasta2a",
    "fasta2a.*",
    "feedparser",
    "great_expectations",
    "markitdown",
    "oracledb",
    "pandas",
    "pandas.*",
    "pandera",
    "plane_agent.*",
    "psycopg",
    "pyarrow",
    "pyarrow.*",
    "pymongo",
    "pymysql",
    "pyodbc",
    "starlette",
    "starlette.*",
    "yfinance",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests import shared fixtures as `tests.<module>`; keep the repository root importable
# however pytest is launched (the shared gates job runs it without `python -m`).
pythonpath = ["."]
timeout = 120
addopts = "-p no:cacheprovider"
markers = [
    "spec: binds a test to a spec requirement ID",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]

[tool.scion_sdk.wiring]
# The documented public surface. scripts/check_wiring.py orphans treats these and
# every entry-point target as roots; every other module must be imported by one.
