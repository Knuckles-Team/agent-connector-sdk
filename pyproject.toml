# Inputs of the shared hooks (Knuckles-Team/pipelines .pre-commit-hooks.yaml).
[tool.pipelines_hooks]
packages = ["scion_sdk"]

[tool.pipelines_hooks.env_sprawl]
allow_files = ["scion_sdk/config.py"]

[tool.pipelines_hooks.stdout_writes]
served_paths = ["scion_sdk"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/scion-sdk"
distribution = "scion-sdk"
pages_url = "https://knuckles-team.github.io/scion-sdk/"
mcp_server = false

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["*.generated.md", "**/*.generated.md", "specs/_template/*"]
