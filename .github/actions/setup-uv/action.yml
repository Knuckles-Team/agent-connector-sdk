name: Set up pinned Python
description: Install the pinned release toolchain after checkout.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version: '0.11.7'
        # SDK-QUALITY-RELEASE-R003: release jobs must use the managed
        # interpreter instead of the hosting runner's system Python.
        python-version: '3.14'
