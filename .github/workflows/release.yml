name: Release

# Publish only: a v* tag or a manual dispatch. An ordinary push to main never
# reaches this workflow (CI-STANDARD). Gates and the
# main-push build live in gates.yml; the same reproducible build runs here
# before upload.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag) to build and publish.
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  publish-pypi:
    name: publish-pypi
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-connector-sdk-wheel
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
      - name: Require a published dependency resolution before release
        run: uv lock --check
      - name: Publish the validated wheel
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish dist/*.whl
