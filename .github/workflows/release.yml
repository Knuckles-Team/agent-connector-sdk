name: Release

# Publish only: a v* tag or a manual dispatch. An ordinary push to main never
# reaches this workflow (CI-STANDARD). Gates and the
# main-push build live in ci.yml; the same reproducible build runs here
# before upload.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (tag) to build and publish.
        required: true
        type: string
      dry_run:
        description: Build and verify without publishing.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ inputs.ref || github.ref }}

  publish-pypi:
    name: publish-pypi
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scion-sdk-wheel
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-connector-sdk-compat
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
      - name: Require a published dependency resolution before release
        run: uv lock --check
      - name: Require the wheel and the source distribution
        run: |
          set -euo pipefail
          ls dist/*.whl dist/*.tar.gz
      # Publish the target distribution first, then its old-name metadata-only
      # forwarder. Each pair stays atomic at the file level, and --check-url
      # makes a retry add only a file PyPI does not already hold with this hash.
      - name: Publish the validated Scion wheel and source distribution
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          uv publish --check-url https://pypi.org/simple/ \
            dist/scion_sdk-*.whl dist/scion_sdk-*.tar.gz
      - name: Publish the old-name compatibility wheel and source distribution
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          set -euo pipefail
          uv publish --check-url https://pypi.org/simple/ \
            dist/agent_connector_sdk-*.whl dist/agent_connector_sdk-*.tar.gz

  # The GitHub release for the tag, created only after the wheel is on PyPI, so
  # the release always links to a package that exists.
  github-release:
    name: github-release
    needs: [publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "PyPI: [\`scion-sdk\` $version](https://pypi.org/project/scion-sdk/$version/)"
            echo "PyPI: [\`agent-connector-sdk\` compatibility release](https://pypi.org/project/agent-connector-sdk/$version/)"
            echo
            echo '```bash'
            echo "pip install \"scion-sdk==$version\""
            echo '```'
            echo
            echo "Commit: $SHA"
          } > "$notes"
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$REPO" --title "Release $TAG" --notes-file "$notes" --latest
          else
            gh release create "$TAG" -R "$REPO" --verify-tag --title "Release $TAG" --notes-file "$notes" --latest
          fi
