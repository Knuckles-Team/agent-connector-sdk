name: Release

# Release-critical jobs only: gates (tests, types, lint, wiring, and the shared
# code-shape, security and hygiene hooks), scanner-quality (pinned cccc/KISS/
# dupehound/jscpd), and a reproducible wheel build. publish-pypi runs only for a
# vX.Y.Z tag. The shared hooks run through pre-commit at the revision pinned in
# .pre-commit-config.yaml, so CI and the local hooks can never run different gate
# code. The ci-gate-replica hook replays the executable jobs locally before a push.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - &python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The base the differential hooks compare against: the pull request base or
      # the previous push, else the root commit (a first push scans all of it).
      - &base
        name: Resolve the published base
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"
          echo "CX_DUP_BASE_REF=$BASE" >> "$GITHUB_ENV"
      - name: Shared security, code-shape and hygiene hooks
        run: |
          set -euo pipefail
          for hook in secret-history dependency-audit supply-chain security-sanitizer root-hygiene gitignore-convergence sprawl mermaid no-stub stubs env-sprawl stdout-writes swallowed-errors event-loop-blocking import-cycles public-surface ci-gate-replica-consistency; do
            uvx --from pre-commit==4.6.0 pre-commit run "$hook" --hook-stage manual --all-files
          done
      # The prohibited-identity catalog is operator-owned and never committed; a
      # missing catalog makes the hook fail closed.
      - name: Tracked-artifact privacy (identity catalog from the repository variable)
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
        run: |
          set -euo pipefail
          if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
            mkdir -p "$HOME/.config/agent-utilities/governance"
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/agent-utilities/governance/prohibited-identities.json"
          fi
          uvx --from pre-commit==4.6.0 pre-commit run tracked-privacy --hook-stage manual --all-files
      - name: Sync the locked environment
        run: uv sync --frozen
      - name: Test suite
        run: uv run --frozen python -m pytest -q
      - name: Type check
        run: uv run --frozen --with mypy==1.20.2 --with types-PyYAML==6.0.12.20260518 python -m mypy agent_connector_sdk
      - name: Lint and format
        run: |
          uvx --from ruff==0.16.0 ruff check agent_connector_sdk tests
          uvx --from ruff==0.16.0 ruff format --check agent_connector_sdk tests
      - name: Wiring gates
        run: |
          python3 scripts/check_wiring.py orphans
          python3 scripts/check_wiring.py public-api

  scanner-quality:
    name: scanner-quality
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *python
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - name: Provision pinned scanner toolchain
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/scanners"
          # cccc 1.6.0 is not published to crates.io (cccc-cli stops at 1.0.0).
          # Install the upstream v1.6.0 tag by its immutable commit instead.
          cargo install --locked --git https://github.com/moznion/cccc --rev d728759323be5d9977b7390a27133e8eaf481f26 --root "$root/cccc" cccc-cli
          cargo install --locked --version 0.4.10 --root "$root/kiss" kiss-ai
          cargo install --locked --version 0.1.2 --root "$root/dupehound" dupehound
          npm install --prefix "$root/npm" --no-package-lock --ignore-scripts --no-save --no-audit --no-fund "jscpd@5.0.16"
          for bin in "$root/cccc/bin" "$root/kiss/bin" "$root/dupehound/bin" "$root/npm/node_modules/.bin"; do
            echo "$bin" >> "$GITHUB_PATH"
          done
      - *base
      - name: Shared scanner hooks (versions, censuses, clone differentials)
        run: |
          set -euo pipefail
          for hook in scanner-versions complexity-census kiss-census dupehound-changed jscpd-differential jscpd-census; do
            uvx --from pre-commit==4.6.0 pre-commit run "$hook" --hook-stage manual --all-files
          done

  build:
    name: build
    needs: [gates, scanner-quality]
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
      - name: Build the wheel twice
        run: |
          uv build --wheel --out-dir dist-primary
          uv build --wheel --out-dir dist-reproduction
      - name: Require byte-identical wheels
        run: |
          python3 -c "from hashlib import sha256; from pathlib import Path; a=sorted(Path('dist-primary').glob('*.whl')); b=sorted(Path('dist-reproduction').glob('*.whl')); assert len(a)==len(b)==1 and a[0].name==b[0].name; assert sha256(a[0].read_bytes()).digest()==sha256(b[0].read_bytes()).digest(), 'wheel is not reproducible'; print('reproducible', a[0].name)"
          mkdir dist
          cp dist-primary/*.whl dist/
      - name: Upload the publish candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-connector-sdk-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish-pypi
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: agent-connector-sdk-wheel
          path: dist
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.7'
      - name: Publish the validated wheel
        run: uv publish --trusted-publishing always dist/*.whl
