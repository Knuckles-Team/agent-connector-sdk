name: CI

# The fleet fast-PR standard (pipelines reference/ci-standard.md). A pull request
# runs one diff-scoped `gates` job (Python 3.14, affected tests); the caller
# aggregate `CI required` is the one required status check. Main and nightly run
# the full suite, supply-chain audit, Python 3.12 backward smoke, the full-tree
# gates, the advisory scanner-quality job and the reproducible build. Never
# publishes (release.yml, v* tag only).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    # Kept as `gates` so the `gates / gates` check keeps reporting until the ruleset requires `CI required`.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      # Homelab runner for same-repo traffic; a fork PR lands on a hosted runner.
      runner: ${{ github.event.pull_request.head.repo.full_name == github.repository && '["self-hosted", "homelab"]' || '"ubuntu-latest"' }}
      timeout-minutes: 45
      test-scope: tests
      src-root: scion_sdk
      setup-command: bash scripts/ci_setup.sh
      uv-cache-local-path: .ci/uv-cache-${{ github.run_id }}-${{ github.run_attempt }}
      # fast-tests duplicates the shared affected-test step; a fork cannot read the identity catalog.
      skip-hooks: ${{ github.event.pull_request.head.repo.fork && 'fast-tests,tracked-privacy' || 'fast-tests' }}
      extra-manual-hooks: tracked-privacy
      # Bash patterns (`*` crosses `/`).
      docs-only-paths: 'specs/* docs/* *.md plans/* LICENSE'

  main-gates:
    # Full-tree gates on main and nightly: every file, wheel build and docs build.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      runner: '["self-hosted", "homelab"]'
      all-files: true
      timeout-minutes: 60
      # Tests run once, in `full`; this job keeps the hook, wheel and docs checks.
      test-scope: ''
      src-root: scion_sdk
      setup-command: bash scripts/ci_setup.sh
      uv-cache-local-path: .ci/uv-cache-${{ github.run_id }}-${{ github.run_attempt }}
      skip-hooks: fast-tests
      extra-manual-hooks: tracked-privacy wheel-build mkdocs-build

  full:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      backward-python: "3.12"
      backward-module: scion_sdk
      runner: '["self-hosted", "homelab"]'
      setup-command: bash scripts/ci_full_setup.sh

  scanner-quality:
    name: scanner-quality
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          enable-cache: true
          cache-dependency-glob: uv.lock
      # scripts/install_scanners.sh is the one place the scanner pins live, so
      # its hash keys the cache: a pin change rebuilds, nothing else does.
      - name: Cache the pinned scanner toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pipelines-scanners
          key: scanners-${{ runner.os }}-${{ hashFiles('scripts/install_scanners.sh') }}
      - name: Provision pinned scanner toolchain
        run: |
          bash scripts/install_scanners.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Resolve the published base
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"
          echo "CX_DUP_BASE_REF=$BASE" >> "$GITHUB_ENV"
      # Advisory: every hook runs and reports; the job result is informational.
      - name: Shared scanner hooks (versions, staged, censuses, clone differentials)
        run: |
          set -uo pipefail
          failed=()
          for hook in scanner-versions complexity-staged kiss-staged dupehound-changed complexity-census kiss-census jscpd-differential jscpd-census; do
            uvx --from pre-commit==4.6.0 pre-commit run --config .config/pre-commit.yaml "$hook" --hook-stage manual --all-files || failed+=("$hook")
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::warning title=scanner-quality::advisory scanner findings: ${failed[*]}"
            exit 1
          fi

  build:
    needs: [main-gates]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml

  ci-required:
    name: CI required
    if: always()
    needs: [gates, main-gates, full, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
