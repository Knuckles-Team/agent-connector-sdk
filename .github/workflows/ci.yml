name: CI

# The fleet fast-PR standard (pipelines reference/ci-standard.md). A pull request
# runs one diff-scoped `gates` job (Python 3.14, affected tests); the caller
# aggregate `CI required` is the one required status check. Main and nightly run
# the full suite, supply-chain audit, Python 3.12 backward smoke, the full-tree
# gates and the reproducible build. Advisory scanners run weekly in advisory.yml. Never
# publishes (release.yml, v* tag only).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || format('main-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gates:
    # Kept as `gates` so the `gates / gates` check keeps reporting until the ruleset requires `CI required`.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      # Homelab runner for same-repo traffic; a fork PR lands on a hosted runner.
      runner: ${{ github.event.pull_request.head.repo.full_name == github.repository && '["self-hosted", "homelab"]' || '"ubuntu-latest"' }}
      timeout-minutes: 45
      test-scope: tests
      src-root: scion_sdk
      setup-command: bash scripts/ci_setup.sh
      uv-cache-local-path: .ci/uv-cache-${{ github.run_id }}-${{ github.run_attempt }}
      # tests-fast duplicates the shared affected-test step; a fork cannot read the identity catalog.
      skip-hooks: ${{ github.event.pull_request.head.repo.fork && 'tests-fast,tracked-privacy' || 'tests-fast' }}
      # Bash patterns (`*` crosses `/`).
      docs-only-paths: 'specs/* docs/* *.md plans/* LICENSE'

  main-gates:
    # Full-tree gates on main and nightly: every file, wheel build and docs build.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/gates_pipeline.yml@main
    with:
      runner: '["self-hosted", "homelab"]'
      all-files: true
      timeout-minutes: 60
      # Tests run once, in `full`; this job keeps the hook, wheel and docs checks.
      test-scope: ''
      src-root: scion_sdk
      setup-command: bash scripts/ci_setup.sh
      uv-cache-local-path: .ci/uv-cache-${{ github.run_id }}-${{ github.run_attempt }}
      skip-hooks: tests-fast
      extra-manual-hooks: wheel-build mkdocs-build

  full:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: Knuckles-Team/pipelines/.github/workflows/main_pipeline.yml@main
    with:
      backward-python: "3.12"
      backward-module: scion_sdk
      runner: '["self-hosted", "homelab"]'
      setup-command: bash scripts/ci_full_setup.sh

  build:
    needs: [main-gates]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml

  ci-required:
    name: CI required
    if: always()
    needs: [gates, main-gates, full, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail on any failed or cancelled job (skipped is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needed job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) echo "::error::a required job ended $r"; exit 1;; esac
          done
