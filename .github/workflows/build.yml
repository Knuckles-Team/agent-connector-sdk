name: Build

# Reproducible wheel build, source distribution and installed-wheel compatibility check. Reusable:
# ci.yml calls it on a push to main (no upload beyond the 7-day candidate
# artifact); release.yml calls it for a v* tag or dispatch, then publishes.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; empty builds the triggering ref.
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: "0"

jobs:
  build:
    name: build
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up the pinned Python toolchain
        uses: ./.github/actions/setup-uv
        id: wheel_toolchain
      - name: Build the wheel twice
        run: |
          uv build --wheel --out-dir dist-primary
          uv build --wheel --out-dir dist-reproduction
      - name: Require byte-identical wheels
        run: |
          python3 -c "from hashlib import sha256; from pathlib import Path; a=sorted(Path('dist-primary').glob('*.whl')); b=sorted(Path('dist-reproduction').glob('*.whl')); assert len(a)==len(b)==1 and a[0].name==b[0].name; assert sha256(a[0].read_bytes()).digest()==sha256(b[0].read_bytes()).digest(), 'wheel is not reproducible'; print('reproducible', a[0].name)"
          mkdir dist
          cp dist-primary/*.whl dist/
      # A release publishes the wheel and the source distribution together, so
      # PyPI never shows a half-published version.
      - name: Build the source distribution
        run: |
          set -euo pipefail
          uv build --sdist --out-dir dist
          python3 -c "from pathlib import Path; w=sorted(Path('dist').glob('*.whl')); s=sorted(Path('dist').glob('*.tar.gz')); assert len(w)==1 and len(s)==1, (w, s); ver=w[0].name.split('-')[1]; assert s[0].name.endswith(f'-{ver}.tar.gz'), (w, s); print('sdist', s[0].name)"
      # The pinned engine wheel from PyPI (scripts/epistemic_graph_release.json). The
      # rolling engine-main release replaces its asset on every engine main build.
      - name: Download the pinned epistemic-graph engine wheel (PyPI)
        run: |
          set -euo pipefail
          mkdir -p dist-engine
          url=$(python3 -c "import json; print(json.load(open('scripts/epistemic_graph_release.json'))['wheel_url'])")
          sha=$(python3 -c "import json; print(json.load(open('scripts/epistemic_graph_release.json'))['wheel_sha256'])")
          curl --fail --silent --show-error --location --retry 3 --output "dist-engine/$(basename "$url")" "$url"
          echo "$sha  dist-engine/$(basename "$url")" | sha256sum -c -
      - name: Verify the installed wheel against the published graph-client (SCION-QUALITY-RELEASE-R001)
        run: python3 scripts/check_wheel_consumer_compatibility.py --wheel dist/*.whl --engine-wheel dist-engine/epistemic_graph-*.whl
      - name: Upload the publish candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scion-sdk-wheel
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-compat:
    name: build-compat
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Set up the pinned Python toolchain
        uses: ./.github/actions/setup-uv
      - name: Build the metadata-only old-name compatibility distribution
        run: |
          set -euo pipefail
          mkdir dist-compat
          (cd compat/agent-connector-sdk && uv build --wheel --sdist --out-dir "$GITHUB_WORKSPACE/dist-compat")
          python3 scripts/check_compatibility_distribution.py \
            --dist-dir dist-compat \
            --source compat/agent-connector-sdk
      - name: Upload the compatibility publish candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-connector-sdk-compat
          path: |
            dist-compat/*.whl
            dist-compat/*.tar.gz
          if-no-files-found: error
          retention-days: 7
