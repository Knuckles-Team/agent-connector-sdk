name: Build

# Reproducible wheel build and installed-wheel compatibility check. Reusable:
# gates.yml calls it on a push to main (no upload beyond the 7-day candidate
# artifact); release.yml calls it for a v* tag or dispatch, then publishes.

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build; empty builds the triggering ref.
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.11.7'
          # SDK-QUALITY-RELEASE-R003: pin the managed interpreter here too --
          # this job builds the released wheel, so it must never fall back to
          # the hosting runner's system Python the way the gates job's own
          # explicit pin already prevents.
          python-version: '3.12'
      - name: Build the wheel twice
        run: |
          uv build --wheel --out-dir dist-primary
          uv build --wheel --out-dir dist-reproduction
      - name: Require byte-identical wheels
        run: |
          python3 -c "from hashlib import sha256; from pathlib import Path; a=sorted(Path('dist-primary').glob('*.whl')); b=sorted(Path('dist-reproduction').glob('*.whl')); assert len(a)==len(b)==1 and a[0].name==b[0].name; assert sha256(a[0].read_bytes()).digest()==sha256(b[0].read_bytes()).digest(), 'wheel is not reproducible'; print('reproducible', a[0].name)"
          mkdir dist
          cp dist-primary/*.whl dist/
      # The pinned engine wheel from PyPI (scripts/epistemic_graph_release.json). The
      # rolling engine-main release replaces its asset on every engine main build.
      - name: Download the pinned epistemic-graph engine wheel (PyPI)
        run: |
          set -euo pipefail
          mkdir -p dist-engine
          url=$(python3 -c "import json; print(json.load(open('scripts/epistemic_graph_release.json'))['wheel_url'])")
          sha=$(python3 -c "import json; print(json.load(open('scripts/epistemic_graph_release.json'))['wheel_sha256'])")
          curl --fail --silent --show-error --location --retry 3 --output "dist-engine/$(basename "$url")" "$url"
          echo "$sha  dist-engine/$(basename "$url")" | sha256sum -c -
      - name: Verify the installed wheel against the published graph-client (SDK-QUALITY-RELEASE-R001)
        run: python3 scripts/check_wheel_consumer_compatibility.py --wheel dist/*.whl --engine-wheel dist-engine/epistemic_graph-*.whl
      - name: Upload the publish candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-connector-sdk-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
