name: Gates skip

# Companion of gates.yml: a docs/spec-only change skips the real workflow, so
# this one reports the required `gates` check as a success. The `paths:` list is
# the exact inverse of gates.yml `paths-ignore:`.

on:
  pull_request:
    paths:
      - specs/**
      - docs/**
      - '**/*.md'
      - plans/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: pr-gates-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "docs/spec-only change; the code gates do not apply"
