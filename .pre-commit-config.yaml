# Combined pre-commit and pre-push scan suite for agent-connector-sdk.
#
# Adopted from agent-packages/agent-utilities/.pre-commit-config.yaml (hook ids,
# pins and stages kept) plus the scanner hooks of agent-packages/epistemic-graph
# (KISS, cccc, dupehound, jscpd at the versions in its scripts/scanner_contract.py).
# Copied gate scripts name their source path in their header. AU hooks that were
# dropped, and why, are listed in AGENTS.md under "Quality gates".
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: ^scripts/
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$
  - id: check-ast
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix"]
  - id: ruff-format
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: ["agent_connector_sdk", "--min-confidence", "95"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    exclude: ^(tests/|scripts/)
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
  hooks:
  - id: uv-lock
    args: ["--locked"]
    stages: [pre-push, manual]
- repo: local
  hooks:
  # ── Types, tests, build, docs (CI parity) ────────────────────────────────
  - id: mypy
    name: mypy (strict, project environment)
    entry: uv run --frozen --with mypy==1.20.2 --with types-PyYAML==6.0.12.20260518 python -m mypy agent_connector_sdk
    language: system
    pass_filenames: false
    files: ^(agent_connector_sdk/.*\.py|pyproject\.toml|uv\.lock)$
  - id: pytest
    name: pytest (full suite)
    entry: uv run --frozen python -m pytest -q
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: docs-build
    name: Pages site build (strict)
    entry: bash -c 'uv run --frozen --only-group docs mkdocs build --strict --site-dir "$(mktemp -d)/site"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: wheel-build
    name: package build
    entry: bash -c 'uv build --out-dir "$(mktemp -d)/dist"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # ── Wiring (RF-ADR-009 section 4) ────────────────────────────────────────
  - id: check-orphan-modules
    name: Wiring — no orphan package modules
    entry: python3 scripts/check_orphan_modules.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-public-api-tested
    name: Wiring — every public name is used by a test
    entry: python3 scripts/check_public_api_tested.py
    language: system
    pass_filenames: false
    always_run: true
  # ── Scanners (pinned; never installed by a hook) ─────────────────────────
  - id: complexity-staged
    name: Complexity (cccc 1.6.0) — no new or worsened function over 10/15
    entry: bash -c 'python3 scripts/scanner_versions.py verify cccc >/dev/null && exec python3 scripts/check_complexity_staged.py'
    language: system
    pass_filenames: false
    always_run: true
  - id: kiss-staged
    name: KISS (0.4.10) — staged package Python, diff-scoped
    entry: python3 scripts/check_kiss_staged.py
    language: system
    pass_filenames: false
    always_run: true
  - id: clone-dupehound-changed-functions
    name: Clone gate — changed functions (dupehound 0.1.2)
    entry: python3 scripts/check_dupehound.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [pre-commit]
  - id: clone-jscpd-diff
    name: Clone gate — new blocks (jscpd 5.0.16, differential)
    entry: >-
      bash -c 'base="${CX_DUP_BASE_REF:-${PRE_COMMIT_FROM_REF:-}}";
      zero=0000000000000000000000000000000000000000; if [ -z "$base" ] || [
      "$base" = "$zero" ]; then base="$(git rev-parse --verify HEAD^ 2>/dev/null
      || git rev-list --max-parents=0 HEAD)"; fi; exec python3
      scripts/check_duplication.py enforce --base-ref "$base"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: clone-jscpd-census
    name: Clone census — full tree (jscpd, advisory)
    entry: python3 scripts/check_duplication.py census
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: scanner-census
    name: Scanner census — cccc and KISS over every package module (absolute zero)
    entry: python3 scripts/scanner_census.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # ── Code-shape gates ─────────────────────────────────────────────────────
  - id: check-stubs
    name: Check for active stubs and TODOs
    entry: python3 scripts/check_stubs.py
    language: system
    types: [python]
    exclude: ^(tests|scripts)/
  - id: guardrail-no-stub
    name: Guardrail — no production stubs
    entry: python3 scripts/check_no_stub.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-env-sprawl
    name: Configuration — environment read only through config.setting
    entry: python3 scripts/check_no_env_sprawl.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-no-stdout-writes
    name: Stdio JSON-RPC purity (no stdout writes in served code)
    entry: python3 scripts/check_no_stdout_writes.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-swallowed-errors
    name: Swallowed errors — no cause-dropping handler added
    entry: python3 scripts/check_swallowed_errors.py
    language: system
    pass_filenames: false
    files: ^agent_connector_sdk/.*\.py$
  - id: check-event-loop-blocking
    name: Event-loop blocking heuristic
    entry: python3 scripts/check_event_loop_blocking.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-import-cycles
    name: Import cycles — zero eager cycles
    entry: uv run --no-project --with networkx==3.6.1 python scripts/check_import_cycles.py
    language: system
    pass_filenames: false
    files: ^agent_connector_sdk/.*\.py$
  # ── Supply chain, secrets, privacy, hygiene ──────────────────────────────
  - id: dependency-readiness
    name: Dependency readiness — every declared intra-fleet constraint is installable
    # --no-cache: uv otherwise reuses a stale build of the local repository-manager
    # path dependency (observed: a build without --phase-direction-here).
    entry: |-
      bash -c 'canonical=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); P="$(dirname "$canonical")/agents/repository-manager"; [ -d "$P" ] || P=repository-manager; uv run --no-cache --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: phase-direction
    name: Phase direction — no dependency on a later workspace phase (RF-ADR-009)
    # repository-manager's own per-repository mode: it resolves this checkout (or
    # linked worktree) from its git remote and checks only its own source.
    entry: |-
      bash -c 'canonical=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); W="$canonical"; while [ "$W" != / ] && [ ! -f "$W/workspace.yml" ]; do W=$(dirname "$W"); done; [ -f "$W/workspace.yml" ] || { echo "phase-direction: no workspace.yml above $canonical" >&2; exit 2; }; P="$(dirname "$canonical")/agents/repository-manager"; exec uv run --no-cache --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.repository_manager --phase-direction-here -f "$W/workspace.yml" -w "$W" --phase-direction-start "$PWD"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: dependency-audit
    name: audit dependencies for known CVEs (OSV)
    entry: python3 scripts/audit_dependencies.py uv.lock
    language: system
    files: ^(uv\.lock|pyproject\.toml|\.security-audit-allow\.txt)$
    pass_filenames: false
  - id: supply-chain-source-contract
    name: enforce immutable workflow, container, and dependency sources
    entry: python3 scripts/check_fleet_supply_chain.py .
    language: system
    files: ^(\.github/workflows/.*\.ya?ml|pyproject\.toml|.*\.lock)$
    pass_filenames: false
  - id: check-secret-history
    name: Credential-shaped content in the unpushed range
    entry: >-
      bash -c 'base="${PRE_COMMIT_FROM_REF:-}";
      zero=0000000000000000000000000000000000000000; if [ -z "$base" ] || [
      "$base" = "$zero" ]; then base="$(git rev-parse --verify HEAD^ 2>/dev/null
      || git rev-list --max-parents=0 HEAD)"; fi; exec python3
      scripts/security/check_secret_history.py --base "$base"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: security-sanitizer
    name: Security and garbage sanitizer
    entry: python3 scripts/security_sanitizer.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-tracked-privacy
    name: Tracked artifacts contain no host-specific data or local identities
    entry: python3 scripts/check_tracked_privacy.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-root-hygiene
    name: Repository root hygiene (allowlisted entries only)
    entry: python3 scripts/check_root_hygiene.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-gitignore-convergence
    name: .gitignore carries the fleet-shared REQUIRED set
    entry: python3 scripts/check_gitignore_convergence.py
    language: system
    pass_filenames: false
    always_run: true
  - id: guardrail-sprawl
    name: Guardrail — anti-sprawl
    entry: python3 scripts/check_sprawl.py
    language: system
    pass_filenames: false
    always_run: true
  - id: check-mermaid
    name: Check Mermaid syntax
    entry: python3 scripts/mermaid_linter.py
    language: system
    files: \.md$
  - id: guardrail-pre-commit-patch-safety
    name: No live uncommitted work parked in the pre-commit patch cache
    entry: python3 scripts/check_pre_commit_patch_safety.py
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c '
        bump2version_bin=""
        for candidate in bump2version "$HOME/.local/bin/bump2version" "$HOME/.local/pipx/venvs/bump2version/bin/bump2version"; do
          if command -v "$candidate" >/dev/null 2>&1; then bump2version_bin="$candidate"; break; fi
        done
        if [ -z "$bump2version_bin" ]; then echo "check-bumpversion: bump2version is not installed" >&2; exit 127; fi
        "$bump2version_bin" patch --dry-run --allow-dirty
      '
    language: system
    pass_filenames: false
    always_run: true
  # ── CI replica ───────────────────────────────────────────────────────────
  - id: ci-gate-replica-consistency
    name: CI gate replica — every workflow job classified
    entry: python3 scripts/ci_gate_replica.py --consistency-check
    language: system
    pass_filenames: false
    always_run: true
  - id: ci-gate-replica
    name: CI gate replica — runs the executable workflow jobs locally (pre-push)
    entry: bash scripts/ci_gate_replica.sh
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
