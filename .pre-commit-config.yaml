# Combined pre-commit and pre-push scan suite for agent-connector-sdk.
#
# Tool hooks are adopted from agent-packages/agent-utilities/.pre-commit-config.yaml
# (hook ids, pins and stages kept). Every repository-agnostic gate -- complexity,
# KISS, clones, secrets, privacy, supply chain, hygiene and code shape -- comes
# from the shared hook repository Knuckles-Team/pipelines at a pinned commit and is
# configured in pyproject.toml [tool.pipelines_hooks]. Shared hooks list `manual`
# so CI runs the identical pinned hook with `--hook-stage manual`. AU hooks that
# were dropped, and why, are listed in AGENTS.md under "Quality gates".
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$
  - id: check-ast
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: fix-byte-order-marker
  - id: check-merge-conflict
  - id: detect-private-key
  - id: trailing-whitespace
  - id: end-of-file-fixer
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: cb8c523fd4835aba42af70f4cad5568db4df0b6c # v0.16.0
  hooks:
  - id: ruff-check
    args: ["--fix"]
  - id: ruff-format
- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    pass_filenames: false
    args: ["agent_connector_sdk", "--min-confidence", "95"]
    require_serial: true
- repo: https://github.com/codespell-project/codespell
  rev: 2ccb47ff45ad361a21071a7eedda4c37e6ae8c5a # v2.4.2
  hooks:
  - id: codespell
- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    exclude: ^(tests/|scripts/)
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 6a280ba12b7901e47757c868c8c13c6a624c9ecb # 0.11.7
  hooks:
  - id: uv-lock
    args: ["--locked"]
    stages: [pre-push, manual]
# ── Shared gates (Knuckles-Team/pipelines, pinned) ─────────────────────────────
- repo: https://github.com/Knuckles-Team/pipelines
  rev: 8f9a755d97a4a03e069799fa853ba64c6bfecbf7 # refactor/shared-hooks (RF-ADR-009 SHARED-HOOKS)
  hooks:
  # scanners (pinned versions; never installed by a hook)
  - id: complexity-staged
    stages: [pre-commit, manual]
  - id: kiss-staged
    stages: [pre-commit, manual]
  - id: dupehound-changed
    stages: [pre-commit, manual]
  - id: complexity-census
    stages: [pre-push, manual]
  - id: kiss-census
    stages: [pre-push, manual]
  - id: jscpd-differential
    stages: [pre-push, manual]
  - id: jscpd-census
    stages: [pre-push, manual]
  - id: scanner-versions
    stages: [pre-push, manual]
  # code shape
  - id: no-stub
    stages: [pre-commit, manual]
  - id: stubs
    exclude: ^tests/
    stages: [pre-commit, manual]
  - id: env-sprawl
    stages: [pre-commit, manual]
  - id: stdout-writes
    stages: [pre-commit, manual]
  - id: swallowed-errors
    stages: [pre-commit, manual]
  - id: event-loop-blocking
    stages: [pre-commit, manual]
  - id: import-cycles
    stages: [pre-commit, manual]
  # supply chain, secrets, privacy, hygiene
  - id: dependency-audit
    stages: [pre-commit, manual]
  - id: supply-chain
    stages: [pre-commit, manual]
  - id: secret-history
    stages: [pre-push, manual]
  - id: security-sanitizer
    stages: [pre-commit, manual]
  - id: tracked-privacy
    stages: [pre-commit, manual]
  - id: root-hygiene
    stages: [pre-commit, manual]
  - id: gitignore-convergence
    stages: [pre-commit, manual]
  - id: sprawl
    stages: [pre-commit, manual]
  - id: mermaid
    stages: [pre-commit, manual]
  - id: pre-commit-patch-safety
    stages: [pre-push, manual]
  # CI replica
  - id: ci-gate-replica-consistency
    stages: [pre-commit, manual]
  - id: ci-gate-replica
    stages: [pre-push]
- repo: local
  hooks:
  # ── Types, tests, build, docs (CI parity) ────────────────────────────────
  - id: mypy
    name: mypy (strict, project environment)
    entry: uv run --frozen --with mypy==1.20.2 --with types-PyYAML==6.0.12.20260518 python -m mypy agent_connector_sdk
    language: system
    pass_filenames: false
    files: ^(agent_connector_sdk/.*\.py|pyproject\.toml|uv\.lock)$
  - id: pytest
    name: pytest (full suite)
    entry: uv run --frozen python -m pytest -q
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: docs-build
    name: Pages site build (strict)
    entry: bash -c 'uv run --frozen --only-group docs mkdocs build --strict --site-dir "$(mktemp -d)/site"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: wheel-build
    name: package build
    entry: bash -c 'uv build --out-dir "$(mktemp -d)/dist"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  # ── Wiring (RF-ADR-009 section 4) ────────────────────────────────────────
  - id: check-orphan-modules
    name: Wiring — no orphan package modules
    entry: python3 scripts/check_wiring.py orphans
    language: system
    pass_filenames: false
    always_run: true
  - id: check-public-api-tested
    name: Wiring — every public name is used by a test
    entry: python3 scripts/check_wiring.py public-api
    language: system
    pass_filenames: false
    always_run: true
  # ── Fleet dependency order ───────────────────────────────────────────────
  - id: dependency-readiness
    name: Dependency readiness — every declared intra-fleet constraint is installable
    # --no-cache: uv otherwise reuses a stale build of the local repository-manager
    # path dependency (observed: a build without --phase-direction-here).
    entry: |-
      bash -c 'canonical=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); P="$(dirname "$canonical")/agents/repository-manager"; [ -d "$P" ] || P=repository-manager; uv run --no-cache --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.dependency_readiness .'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: phase-direction
    name: Phase direction — no dependency on a later workspace phase (RF-ADR-009)
    # repository-manager's own per-repository mode: it resolves this checkout (or
    # linked worktree) from its git remote and checks only its own source.
    entry: |-
      bash -c 'canonical=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); W="$canonical"; while [ "$W" != / ] && [ ! -f "$W/workspace.yml" ]; do W=$(dirname "$W"); done; [ -f "$W/workspace.yml" ] || { echo "phase-direction: no workspace.yml above $canonical" >&2; exit 2; }; P="$(dirname "$canonical")/agents/repository-manager"; exec uv run --no-cache --no-project --python 3.12 --prerelease=allow --with "$P" python -m repository_manager.repository_manager --phase-direction-here -f "$W/workspace.yml" -w "$W" --phase-direction-start "$PWD"'
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual, pre-push]
  - id: check-bumpversion
    name: validate bumpversion config
    entry: |-
      bash -c '
        bump2version_bin=""
        for candidate in bump2version "$HOME/.local/bin/bump2version" "$HOME/.local/pipx/venvs/bump2version/bin/bump2version"; do
          if command -v "$candidate" >/dev/null 2>&1; then bump2version_bin="$candidate"; break; fi
        done
        if [ -z "$bump2version_bin" ]; then echo "check-bumpversion: bump2version is not installed" >&2; exit 127; fi
        "$bump2version_bin" patch --dry-run --allow-dirty
      '
    language: system
    pass_filenames: false
    always_run: true
