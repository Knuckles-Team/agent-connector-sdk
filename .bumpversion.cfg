[bumpversion]
current_version = 0.5.9
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:compat/agent-connector-sdk/pyproject.toml]
search = {current_version}
replace = {new_version}

[bumpversion:file:compat/agent-connector-sdk/README.md]
search = {current_version}
replace = {new_version}

[bumpversion:file:uv.lock]
search =
	name = "scion-sdk"
	version = "{current_version}"
replace =
	name = "scion-sdk"
	version = "{new_version}"
