[bumpversion]
current_version = 0.6.4
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file:uv.lock]
search =
	name = "scion-sdk"
	version = "{current_version}"
replace =
	name = "scion-sdk"
	version = "{new_version}"
